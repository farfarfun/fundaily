[project]
name = "fundaily"
version = "0.0.2"
description = "占位包：保留 fundaily 包名，暂无功能代码，仅暴露 __version__"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = []

[project.urls]
Homepage = "https://pypi.org/project/fundaily/"
Repository = "https://github.com/farfarfun/fundaily"
Organization = "https://github.com/farfarfun"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundaily"]

[tool.hatch.build.targets.sdist]
exclude = ["/uv.lock"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
